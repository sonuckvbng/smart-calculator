server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location /api/calculator/ { proxy_pass http://calculator-service:8081/; }
  location /api/history/ { proxy_pass http://history-service:8082/; }
  location /api/learning/ { proxy_pass http://learning-service:8083/; }
  location / { try_files $uri $uri/ /index.html; }
}
